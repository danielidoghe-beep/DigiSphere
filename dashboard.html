<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard | DigiSphere</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="dashboard.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<!-- Loading Screen -->

<div id="loader">

    <div class="loader-logo">
        <i class="fa-solid fa-layer-group"></i>
    </div>

</div>

<!-- Overlay -->

<div id="overlay"></div>

<!-- Sidebar -->

<aside id="sidebar">

    <div class="sidebar-header">

        <div class="logo">

            <i class="fa-solid fa-layer-group"></i>

            <span>DigiSphere</span>

        </div>

        <button id="closeSidebar">

            <i class="fa-solid fa-xmark"></i>

        </button>

    </div>

    <nav>

        <a href="dashboard.html">

            <i class="fa-solid fa-house"></i>

            Dashboard

        </a>

        <a href="wallet.html">

            <i class="fa-solid fa-wallet"></i>

            Wallet

        </a>

        <a href="orders.html">

            <i class="fa-solid fa-bag-shopping"></i>

            Orders

        </a>

        <a href="inventory.html">

            <i class="fa-solid fa-box"></i>

            Inventory

        </a>

        <a href="support.html">

            <i class="fa-solid fa-headset"></i>

            Support

        </a>

        <a href="profile.html">

            <i class="fa-solid fa-user"></i>

            Profile

        </a>

        <a href="#" id="logoutBtn">

            <i class="fa-solid fa-right-from-bracket"></i>

            Logout

        </a>

    </nav>

</aside>

<!-- Main -->

<div class="dashboard">

    <!-- Top Navigation -->

    <header class="topbar">

        <button id="menuBtn" class="icon-btn">

            <i class="fa-regular fa-window-maximize"></i>

        </button>

        <div class="top-right">

            <!-- Wallet Pill -->

            <button class="wallet-pill">

                <span>₦</span>

                <span id="topWallet">

                    0

                </span>

            </button>

            <!-- Theme -->

            <button
            id="themeToggle"
            class="icon-btn">

                <i class="fa-regular fa-sun"></i>

            </button>

            <!-- Notification -->

            <button class="icon-btn notification-btn">

                <i class="fa-regular fa-bell"></i>

                <span
                id="notificationCount"
                class="notification-badge">

                </span>

            </button>

            <!-- Avatar -->

            <div
            id="userAvatar"
            class="avatar">

                DD

            </div>

        </div>

    </header>

    <!-- Welcome -->

    <section class="welcome">

        <h1>

            Welcome back,

            <span id="userName">

                Loading...

            </span>

            👋

        </h1>

        <p>

            Here's what's going on with your account

        </p>

    </section>

    <!-- Cards -->

    <section class="summary-cards">

        <!-- Wallet -->

        <div class="summary-card">

            <small>

                Wallet balance

            </small>

            <h2 id="walletBalance">

                ₦0

            </h2>

            <a href="wallet.html">

                View history

                <i class="fa-solid fa-arrow-right"></i>

            </a>

        </div>

        <!-- Purchases -->

        <div class="summary-card">

            <small>

                Total purchases

            </small>

            <h2 id="purchaseCount">

                0

            </h2>

            <a href="orders.html">

                View orders

                <i class="fa-solid fa-arrow-right"></i>

            </a>

        </div>

        <!-- Inventory -->

        <div class="summary-card">

            <small>

                Available inventory

            </small>

            <h2 id="inventoryCount">

                0

            </h2>

            <p id="inventoryBreakdown">

                0 logs · 0 tools

            </p>

        </div>

    </section>

</div>

<script src="theme.js"></script>

<script type="module" src="dashboard.js"></script>

</body>
</html>
